<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fahrtenbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fahrtenbuch">
<meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kopfzeile + Reiter oben, darunter je Reiter Karten mit Formularen und bearbeitbaren Tabellen.
   Tabellen scrollen waagrecht in ihrem eigenen Kasten, die Seite selbst nie. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --sunk:#e4e7f1; --ink:#151a33; --muted:#5d6482; --line:#d7dbe8;
  --accent:#2b3fd1; --accent-ink:#ffffff; --accent-soft:#e2e6ff;
  --ok:#1d8a5a; --ok-soft:#dcf2e7; --warn:#c2410c; --warn-soft:#fdeadb; --hi:#c8283a; --hi-soft:#fbe1e4;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1220; --surface:#181c30; --sunk:#12162a; --ink:#e9ecfa; --muted:#9aa1c2; --line:#2b3150;
  --accent:#8c9bff; --accent-ink:#0f1220; --accent-soft:#252c55;
  --ok:#4cc38a; --ok-soft:#173326; --warn:#f59e5b; --warn-soft:#3a2416; --hi:#f07a84; --hi-soft:#3d1a20;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--body);font-weight:600;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.who{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:9px 12px;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{display:grid;gap:16px;padding-top:16px}
h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
h3{font-size:1rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
label.f small{font-weight:400}
label.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
input,select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input[type=checkbox]{width:18px;height:18px;padding:0}
input[type=range]{padding:0;accent-color:var(--accent);flex:1 1 140px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--hi-soft);color:var(--hi)}
.btn.danger.armed{background:var(--hi);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:6px 10px;font-size:.85rem}
.msg{border-radius:10px;padding:10px 12px;font-size:.92rem}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.err{background:var(--hi-soft);color:var(--hi)} .msg.info{background:var(--accent-soft)}
.msg ul{margin:6px 0 0;padding-left:20px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:.75rem;color:var(--muted);font-weight:700;padding:6px 6px;white-space:nowrap;z-index:1}
td{border-top:1px solid var(--line);padding:2px 3px;vertical-align:middle}
td input,td select{border:1px solid transparent;border-radius:6px;padding:5px 6px;font-size:14px;background:transparent;width:100%}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--surface)}
td.num input{text-align:right}
td.ro{color:var(--muted);text-align:right;padding-right:8px;white-space:nowrap}
tr.we td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
tr.sum td{font-weight:700;background:var(--sunk);padding:7px 8px}
td .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:4px 6px}
td .x:hover{color:var(--hi)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.log{max-height:220px;overflow:auto;font-size:.85rem;color:var(--muted);display:grid;gap:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.login{max-width:420px;margin:8vh auto 0}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.tabs2 button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:min(92vw,560px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--hi);color:#fff}
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent);display:grid;place-items:center;z-index:40;font-weight:700}
details summary{cursor:pointer;font-weight:700}
.right{margin-left:auto}
@media (max-width:640px){h1{font-size:1.3rem}.card{padding:12px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" hidden></div>
<div class="busy" id="busy" hidden><span id="busytxt">Bitte warten …</span></div>
<script>
'use strict';
/* ===================== Grundlagen ===================== */
const MONATE = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const S = { token: '', user: null, d: null, tab: 'generator', jahr: new Date().getFullYear(), monat: new Date().getMonth() + 1, y: null, imports: {} };
try { const a = JSON.parse(localStorage.getItem('fb.auth') || 'null'); if (a) { S.token = a.token; S.user = a.user; } S.tab = localStorage.getItem('fb.tab') || S.tab; } catch (e) {}
const $ = (s, el = document) => el.querySelector(s);

// DOM-Bauer: h('div.card', {onclick}, kinder...)
function h(tag, attrs, ...kids) {
  const [t, ...cls] = tag.split('.');
  const el = document.createElement(t || 'div');
  if (cls.length) el.className = cls.join(' ');
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  add(el, kids);
  return el;
}
function add(el, kids) { for (const k of kids.flat(9)) if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k))); return el; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const fmt = n => Number(n || 0).toLocaleString('de-AT');
const eur = n => Number(n || 0).toLocaleString('de-AT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dDE = iso => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';
const wd = iso => WT[(new Date(iso + 'T12:00:00').getDay() + 6) % 7];
const minutes = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? +m[1] * 60 + +m[2] : 0; };
const hhmm = m => { m = Math.max(0, m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 7000 : 3500);
}
function busy(on, txt) { $('#busy').hidden = !on; $('#busytxt').textContent = txt || 'Bitte warten …'; }

async function api(action, data, opts = {}) {
  let res;
  try {
    res = await fetch('api.php?action=' + action + (opts.qs || ''), {
      method: 'POST', headers: Object.assign({ 'X-Auth-Token': S.token }, opts.form ? {} : { 'Content-Type': 'application/json' }),
      body: opts.form || JSON.stringify(data || {}) });
  } catch (e) { throw new Error('Keine Verbindung zum Server. Bitte Internet prüfen.'); }
  if (opts.blob && res.ok) return res.blob();
  let j = {};
  try { j = await res.json(); } catch (e) { throw new Error('Unerwartete Antwort vom Server (' + res.status + ').'); }
  if (res.status === 401 && action !== 'login') { logout(true); throw new Error('Bitte neu anmelden.'); }
  if (!res.ok) throw new Error(j.error || ('Fehler ' + res.status));
  return j;
}
async function run(fn, txt) {
  busy(true, txt);
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { busy(false); }
}
// Lösch-Knopf: zweimal tippen (kein confirm())
function dangerBtn(label, fn) {
  const b = h('button.btn.danger', { type: 'button' }, label); let armed = false, t;
  b.onclick = () => {
    if (!armed) { armed = true; b.classList.add('armed'); b.textContent = 'Wirklich? Nochmal tippen'; t = setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = label; }, 4000); return; }
    clearTimeout(t); armed = false; b.classList.remove('armed'); b.textContent = label; fn();
  };
  return b;
}
const field = (label, input, hint) => h('label.f', null, label, hint ? h('small', null, hint) : null, input);
const msgBox = (cls, ...k) => h('div.msg.' + cls, null, ...k);
function listMsg(cls, title, items, htmlItems) {
  return msgBox(cls, h('div', { html: md(title) }), items.length ? h('ul', null, items.map(i => h('li', htmlItems ? { html: md(i) } : null, htmlItems ? null : i))) : null);
}
function sel(options, value, attrs) {
  const s = h('select', attrs);
  for (const o of options) { const [v, l] = Array.isArray(o) ? o : [o, o]; const op = h('option', { value: v }, l); if (String(v) === String(value)) op.selected = true; s.append(op); }
  return s;
}
function jahreOptionen() {
  const now = new Date().getFullYear(); const set = new Set((S.d?.jahre || []).concat(Array.from({ length: 13 }, (_, i) => now - 10 + i)));
  return [...set].sort((a, b) => a - b);
}
function download(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickFile(accept) {
  return new Promise(res => { const i = h('input', { type: 'file', accept }); i.onchange = () => res(i.files[0] || null); i.click(); });
}
async function importFile(typ, accept = '.xlsx,.csv') {
  const f = await pickFile(accept); if (!f) return null;
  const fd = new FormData(); fd.append('file', f);
  return run(() => api('import', null, { form: fd, qs: '&typ=' + typ }), 'Datei wird gelesen …');
}

/* ===================== Bearbeitbare Tabelle ===================== */
// cols: {k, label, type: text|int|date|time|select|ro, opts:[[v,l]], w, fmt(row)}  – liefert {el, rows()}
function grid(cols, rows, o = {}) {
  rows = rows.map(r => Object.assign({}, r));
  const wrap = h('div.tbl'); const tb = h('tbody');
  const table = h('table', null, h('thead', null, h('tr', null, cols.map(c => h('th', { style: c.w ? 'min-width:' + c.w : null }, c.label)), o.del !== false ? h('th') : null)), tb);
  wrap.append(table);
  const draw = () => {
    tb.replaceChildren();
    rows.forEach((r, i) => {
      const tr = h('tr', { class: o.rowClass ? o.rowClass(r) : null });
      for (const c of cols) {
        let td;
        if (c.type === 'ro') td = h('td.ro', null, c.fmt ? c.fmt(r) : (r[c.k] ?? ''));
        else {
          let inp;
          if (c.type === 'select') inp = sel([['', '–']].concat(c.opts), r[c.k] ?? '');
          else inp = h('input', { type: c.type === 'int' ? 'number' : (c.type === 'date' ? 'date' : 'text'), value: r[c.k] ?? '', inputmode: c.type === 'int' ? 'numeric' : (c.type === 'time' ? 'numeric' : null),
            placeholder: c.type === 'time' ? 'HH:MM' : (c.ph || null), step: c.type === 'int' ? '1' : null, min: c.min ?? null, list: c.list || null, 'aria-label': c.label });
          inp.addEventListener('change', () => {
            let v = inp.value;
            if (c.type === 'int') v = v === '' ? (c.nullable ? null : 0) : parseInt(v, 10);
            if (c.type === 'select' && c.num) v = v === '' ? null : parseInt(v, 10);
            if (c.type === 'time' && /^\d{1,2}[:.]?\d{2}$/.test(v)) { const d = v.replace(/\D/g, '').padStart(4, '0'); v = d.slice(0, 2) + ':' + d.slice(2); inp.value = v; }
            r[c.k] = v;
            if (o.onChange) o.onChange(r, c.k, tr);
          });
          td = h('td', { class: c.type === 'int' ? 'num' : null, style: c.w ? 'min-width:' + c.w : null }, inp);
        }
        tr.append(td);
      }
      if (o.del !== false) tr.append(h('td', null, h('button.x', { type: 'button', title: 'Zeile löschen', 'aria-label': 'Zeile löschen', onclick: () => { rows.splice(i, 1); draw(); o.onChange && o.onChange(); } }, '✕')));
      tb.append(tr);
    });
    if (o.sum) tb.append(o.sum(rows));
  };
  draw();
  return { el: wrap, rows: () => rows, addRow: r => { rows.push(Object.assign({}, r)); draw(); }, redraw: draw, set: rs => { rows = rs.map(r => Object.assign({}, r)); draw(); } };
}

/* ===================== Start / Anmeldung ===================== */
function saveAuth() { try { localStorage.setItem('fb.auth', JSON.stringify({ token: S.token, user: S.user })); } catch (e) {} }
function logout(silent) {
  if (!silent && S.token) api('logout').catch(() => {});
  S.token = ''; S.user = null; S.d = null; S.y = null;
  try { localStorage.removeItem('fb.auth'); } catch (e) {}
  renderLogin();
}
async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!S.token) return renderLogin();
  try {
    const me = await api('me'); S.user = me.user; saveAuth();
    if (S.user.force_pw_change) return renderPwChange();
    await loadInit(); renderApp();
  } catch (e) { if (S.token) { toast(e.message, true); renderLogin(); } }
}
async function loadInit() { S.d = await api('init'); S.user = S.d.user; saveAuth(); }

function renderLogin(tab = 'login') {
  const app = $('#app'); app.replaceChildren();
  const card = h('div.card');
  const tabs = h('div.tabs2', null, [['login', 'Anmelden'], ['reg', 'Registrieren'], ['reset', 'Passwort vergessen']].map(([k, l]) =>
    h('button', { type: 'button', 'aria-selected': String(tab === k), onclick: () => renderLogin(k) }, l)));
  card.append(tabs);
  if (tab === 'login') {
    const u = h('input', { autocomplete: 'username', autocapitalize: 'none' }), p = h('input', { type: 'password', autocomplete: 'current-password' });
    const f = h('form.card', { style: 'border:0;padding:0', onsubmit: async e => { e.preventDefault();
      await run(async () => { const r = await api('login', { username: u.value, password: p.value }); S.token = r.token; S.user = r.user; saveAuth(); boot(); }, 'Anmelden …'); } },
      field('Benutzername', u), field('Passwort', p), h('button.btn', { type: 'submit' }, 'Anmelden'));
    card.append(f); setTimeout(() => u.focus(), 50);
  } else if (tab === 'reg') {
    const u = h('input', { autocapitalize: 'none' }), m = h('input', { type: 'email' }), p = h('input', { type: 'password', autocomplete: 'new-password' }), c = h('input', { type: 'password' });
    card.append(h('p.hint', null, 'Den Einladungs-Code bekommst du vom Admin.'), field('Benutzername', u), field('E-Mail', m), field('Passwort', p, '(mind. 6 Zeichen)'), field('Einladungs-Code', c),
      h('button.btn', { type: 'button', onclick: () => run(async () => { await api('register', { username: u.value, email: m.value, password: p.value, invite: c.value }); toast('Zugang erstellt – bitte anmelden.'); renderLogin('login'); }) }, 'Zugang erstellen'));
  } else {
    const u = h('input', { autocapitalize: 'none' });
    card.append(h('p.hint', null, 'Benutzernamen eingeben. Du bekommst ein neues Passwort an deine hinterlegte E-Mail-Adresse (auch im Spam-Ordner nachsehen).'), field('Benutzername', u),
      h('button.btn', { type: 'button', onclick: () => run(async () => { await api('reset_request', { username: u.value }); toast('Neues Passwort wurde per E-Mail geschickt.'); renderLogin('login'); }) }, 'Neues Passwort anfordern'));
  }
  app.append(h('div.login', null, h('h1', { style: 'margin:0 0 16px' }, h('small', null, 'Fahrtenbuch-Generator'), 'Fahrtenbuch'), card));
}
function renderPwChange() {
  const app = $('#app'); app.replaceChildren();
  const p1 = h('input', { type: 'password', autocomplete: 'new-password' }), p2 = h('input', { type: 'password', autocomplete: 'new-password' });
  app.append(h('div.login', null, h('h1', { style: 'margin-bottom:16px' }, 'Passwort ändern'), h('div.card', null,
    msgBox('warn', 'Bitte vor der ersten Nutzung ein eigenes Passwort setzen.'), field('Neues Passwort', p1, '(mind. 6 Zeichen)'), field('Neues Passwort wiederholen', p2),
    h('button.btn', { type: 'button', onclick: () => { if (p1.value !== p2.value) return toast('Die Passwörter stimmen nicht überein.', true);
      run(async () => { await api('password', { new: p1.value }); toast('Passwort geändert. Willkommen!'); boot(); }); } }, 'Speichern und weiter'),
    h('button.btn.sec', { type: 'button', onclick: () => logout() }, 'Abmelden'))));
}

/* ===================== App-Rahmen ===================== */
const TABS = [['generator', 'Generator'], ['fahrten', 'Fahrten & Prüfung'], ['fahrzeuge', 'Fahrzeuge & Orte'], ['privat', 'Privat-KM'], ['hu', 'HU'], ['export', 'PDF-Export'], ['stamm', 'Stammdaten'], ['admin', 'Admin']];
function renderApp() {
  const app = $('#app'); app.replaceChildren();
  const tabs = TABS.filter(([k]) => k !== 'admin' || S.user.is_admin);
  if (!tabs.some(([k]) => k === S.tab)) S.tab = 'generator';
  const nav = h('nav', { role: 'tablist' }, tabs.map(([k, l]) => h('button', { role: 'tab', 'aria-selected': String(S.tab === k), onclick: () => { S.tab = k; try { localStorage.setItem('fb.tab', k); } catch (e) {} renderApp(); } }, l)));
  app.append(h('header', null, h('div.top', null, h('h1', null, h('small', null, 'Fahrtenbuch-Generator'), 'Fahrtenbuch'),

      h('p.hint', null, 'Nur wenn die Prüfung Sprünge in der Kette meldet: berechnet „KM Abfahrt“ ab dem Jahres-Anker neu (auch Folgejahre). Gefahrene Kilometer bleiben unverändert.'),
      h('div.grid2', null, field('Benutzer', rcU), field('Jahr', rcJ)),
      h('div.row', null, dangerBtn('Kette neu berechnen', () => run(async () => { await api('admin_rechain', { username: rcU.value, jahr: +rcJ.value }); S.y = null; toast('Kette neu berechnet. Systemprüfung erneut starten.'); })))))));

  // Analyse-Zugang für Claude
  const akOut = h('div', { style: 'display:grid;gap:8px' });
  main.append(h('div.card', null, h('h2', null, 'Analyse-Zugang für Claude (nur lesen)'),
    h('p.hint', null, 'Erzeugt einen Schlüssel, mit dem Claude die Systemprüfung und alle Fahrtenbuch-Daten LESEN kann – nichts ändern, keine Passwörter. Gültig 14 Tage, jederzeit sperrbar. Den Schlüssel nur in das sichere Formular von Claude einfügen, nicht in den Chat.'),
    cf.analyse_bis ? msgBox('info', 'Ein Analyse-Schlüssel ist aktiv bis ' + cf.analyse_bis + ' (UTC).') : msgBox('ok', 'Kein Analyse-Schlüssel aktiv.'),
    h('div.row', null, h('button.btn', { type: 'button', onclick: () => run(async () => { const r = await api('admin_analyse_key', {});
      const inp = h('input', { value: r.key, readonly: true }); akOut.replaceChildren(msgBox('warn', 'Schlüssel wird nur JETZT angezeigt. Kopieren und in Claudes sicheres Formular einfügen:'), inp,
        h('div.row', null, h('button.btn.sec', { type: 'button', onclick: async () => { try { await navigator.clipboard.writeText(r.key); toast('Schlüssel kopiert.'); } catch (e) { inp.select(); toast('Bitte markierten Text kopieren.'); } } }, 'Schlüssel kopieren'))); }) }, 'Schlüssel erzeugen (14 Tage)'),
      cf.analyse_bis ? dangerBtn('Zugang sperren', () => run(async () => { await api('admin_analyse_key', { sperren: true }); toast('Analyse-Zugang gesperrt.'); renderApp(); })) : null), akOut));

  // Supabase-Umzug
  const su = h('input', { placeholder: 'https://slwcirzmjuchdqzwckky.supabase.co', value: 'https://slwcirzmjuchdqzwckky.supabase.co' }), sk = h('input', { type: 'password', placeholder: 'service_role-Schlüssel', autocomplete: 'off' });
  const log = h('div.log'); const bar = h('div.bar', null, h('div'));
  const TABLES = ['users', 'settings', 'system_config', 'fahrzeuge', 'zeitraeume', 'orte', 'orte_distanz', 'ort_koordinaten', 'distanz_matrix', 'jahres_start_km', 'generation_settings', 'hu_corrections', 'fahrten'];
  main.append(h('div.card', null, h('h2', null, 'Umzug von Supabase'),
    msgBox('warn', 'Einmalig: holt ALLE Daten (Benutzer, Stammdaten, Fahrzeuge, Zeiträume, Orte, Distanzen, Anker, HU, Fahrten) aus Supabase und ERSETZT die Daten hier. Bestehende Zugänge hier behalten ihr Passwort; alle anderen melden sich mit ihrem bisherigen Passwort an.'),
    h('p.hint', null, 'Den Schlüssel findest du in Supabase unter Project Settings → API → „service_role“ (bzw. „secret“). Er wird nur für diesen Umzug verwendet und nicht gespeichert.'),
    h('div.grid2', null, field('Supabase-Adresse', su), field('service_role-Schlüssel', sk)),
    h('div.row', null, dangerBtn('Daten aus Supabase übernehmen', async () => {
      log.replaceChildren(); bar.firstChild.style.width = '0'; let i = 0;
      try {
        for (const t of TABLES) {
          log.prepend(h('div', null, 'Lese ' + t + ' …'));
          const r = await api('admin_supabase', { url: su.value.trim(), key: sk.value.trim(), table: t });
          log.firstChild.textContent = `✓ ${t}: ${r.gelesen} gelesen, ${r.uebernommen} übernommen` + (r.hinweis ? ' – ' + r.hinweis : '');
          bar.firstChild.style.width = (++i / TABLES.length * 100) + '%';
        }
        log.prepend(h('div.msg.ok', null, 'Umzug fertig. Bitte Fahrzeuge, Jahre und ein PDF stichprobenartig mit der alten App vergleichen.'));
        await loadInit(); S.y = null;
      } catch (e) { log.prepend(h('div.msg.err', null, 'Abgebrochen bei ' + TABLES[i] + ': ' + e.message)); }
    })), bar, log));
}

boot();
</script>
